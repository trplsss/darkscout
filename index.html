<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Darkscout</title>
<style>
:root{--bg:#000;--card:#09090b;--line:#1a1a20;--tx:#ededf2;--mut:#777784;--a:#8b5cff;--b:#ff3d81;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 "Manrope","Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:-1}
main{max-width:1080px;margin:0 auto;padding:0 20px 90px}
header{text-align:center;padding:16vh 0 30px;transition:padding .9s var(--ease)}
body.s header{padding:26px 0 16px}
h1{font:800 clamp(44px,10vw,104px)/1 "Manrope",system-ui;letter-spacing:.06em;transition:font-size .9s var(--ease)}
body.s h1{font-size:32px}
h1 i{font-style:normal;display:inline-block;opacity:0;filter:blur(14px);transform:translateY(30px) scale(1.2);animation:in 1s var(--ease) forwards;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes in{to{opacity:1;filter:none;transform:none}}
.sub{color:var(--mut);margin-top:10px;opacity:0;animation:in 1.2s 1s forwards;max-height:40px;transition:all .6s var(--ease)}
body.s .sub{max-height:0;margin:0;opacity:0!important;overflow:hidden}
.bar{display:flex;gap:8px;max-width:780px;margin:0 auto;padding:7px;border:1px solid var(--line);border-radius:20px;background:#050507d9;backdrop-filter:blur(16px);transition:.4s}
.bar:focus-within{border-color:var(--a);box-shadow:0 0 50px #8b5cff30}
input[type=text]{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;padding:12px 16px}
button{font:inherit;color:var(--tx);background:#14141a;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;transition:.25s var(--ease)}
button:hover{border-color:var(--a);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.go{background:linear-gradient(120deg,var(--a),var(--b));border:0;font-weight:700;padding:0 26px;border-radius:14px}
.go:hover{transform:scale(1.04);box-shadow:0 8px 30px #ff3d8140}
.opts{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;align-items:center;margin:18px auto 0;color:var(--mut);font-size:13px;max-width:900px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=range]{accent-color:var(--a);width:120px}
select{background:#0b0b0f;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit}
.hist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.hist button{font-size:12px;padding:4px 10px;border-radius:99px;color:var(--mut)}
.prog{height:2px;background:var(--line);margin:22px 0 8px;border-radius:2px;overflow:hidden;opacity:0;transition:.4s}
.prog.on{opacity:1}.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s var(--ease)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:13px;min-height:34px;align-items:center}
.tabs button.on{border-color:var(--a);background:#1a1230}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;animation:rise .7s var(--ease) both;transition:border-color .3s,transform .4s var(--ease);position:relative;overflow:hidden}
.card:hover{border-color:#34285f;transform:translateY(-3px)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x,50%) var(--y,-20%),#8b5cff18,transparent);pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}}
.card h3{font-size:16px;font-weight:700;padding-right:60px}
.card .u{color:var(--a);font-size:13px;text-decoration:none}
.card p{color:var(--mut);font-size:13px;margin:10px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{display:flex;gap:16px;font-size:13px;margin:12px 0 8px}.st b{display:block;font-size:20px}
.rb{height:4px;background:#17171d;border-radius:4px;overflow:hidden}.rb i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));width:0;transition:width 1.2s var(--ease)}
.act{display:flex;gap:6px;margin-top:14px}.act button{padding:6px 11px;font-size:13px}
.act .o{flex:1;text-align:center;text-decoration:none;color:var(--tx);background:#14141a;border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:13px;transition:.25s}.act .o:hover{border-color:var(--a)}
.tag{position:absolute;top:16px;right:16px;font-size:11px;padding:2px 9px;border-radius:99px;background:#1a1230;color:#bda7ff}
.fresh{background:#12261b;color:#7be0a3}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.ov{position:fixed;inset:0;background:#000d;backdrop-filter:blur(10px);display:none;place-items:center;z-index:9;padding:20px}
.ov.on{display:grid}.ov>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:420px;width:100%;animation:rise .6s var(--ease)}
.ov input,.ov textarea{width:100%;background:#0b0b0f;border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:12px;margin:10px 0}
.ov p{color:var(--mut);font-size:13px}.ov textarea{height:100px;font-size:12px}
</style>
<canvas id="c"></canvas>
<main>
<header><h1 id="t"></h1><div class="sub">Поиск 18+ каналов с реальными видео — по всему Telegram и интернету</div></header>
<form class="bar" id="f"><input type="text" id="q" placeholder="Ключевое слово…" autocomplete="off" autofocus><button class="go">Искать</button></form>
<div class="opts">
<label>Мин. видео <input type="range" id="mv" min="0" max="500" step="10" value="30"><b id="mvv">30</b></label>
<label>Мин. подписчиков <select id="ms"><option value="0">любое</option><option value="500">500+</option><option value="5000">5 000+</option><option value="50000">50 000+</option></select></label>
<label><input type="checkbox" id="act"> Только активные (30 дней)</label>
<label><input type="checkbox" id="web" checked> Поиск в интернете</label>
<label><input type="checkbox" id="deep"> Глубокий поиск (связанные каналы)</label>
<label>Сортировка <select id="so"><option value="score">по рейтингу</option><option value="videos">по числу видео</option><option value="ratio">по доле видео</option><option value="subs">по подписчикам</option></select></label>
</div>
<div class="hist" id="h"></div>
<div class="prog" id="pg"><b></b></div>
<div class="meta"><span id="stt"></span><span class="tabs"><button id="tr" class="on">Результаты</button> <button id="tf">★ Избранное</button> <button id="ex">Копировать ссылки</button> <button id="csv">CSV</button></span></div>
<div class="grid" id="g"></div>
</main>
<div class="ov" id="ov"><div><h3 id="ot"></h3><p id="op"></p><input id="oi" autocomplete="off"><button class="go" id="ob" style="width:100%;padding:12px"></button><p id="oe" style="color:#ff6b8b"></p></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage[k])}catch{return d}};
let K=localStorage.k||"",step="phone";
const api=async(u,o={})=>{const r=await fetch(u+(u.includes("?")?"&":"?")+"k="+encodeURIComponent(K),o);if(r.status===401){K=prompt("Пароль сайта")||"";localStorage.k=K;return api(u,o)}return r.json()};
const ask=(t,p,h,b)=>{$("#ot").textContent=t;$("#op").textContent=p;$("#oi").placeholder=h;$("#oi").value="";$("#ob").textContent=b;$("#ov").classList.add("on");$("#oi").focus()};
$("#ob").onclick=async()=>{if(step==="fin"){navigator.clipboard&&navigator.clipboard.writeText($("#oi").value);$("#ov").classList.remove("on");return}
 const v=$("#oi").value.trim();if(!v)return;$("#oe").textContent="";let body;
 if(step==="phone")body={phone:v};else if(step==="code"){window.cd=v;body={code:v}}else body={code:window.cd,password:v};
 const r=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(r.error){$("#oe").textContent=r.error;return}
 if(r.step==="code"){step="code";ask("Код из Telegram","Откройте приложение Telegram: код пришлёт чат «Telegram» (иногда SMS).","Код","Войти")}
 else if(r.step==="password"){step="password";ask("Облачный пароль","У аккаунта включена двухэтапная защита. Введите её пароль.","Пароль","Войти")}
 else if(r.step==="done"){step="fin";$("#ot").textContent="Готово ✓";$("#op").innerHTML="Скопируйте этот ключ и вставьте в Render → Environment → <b>SESSION</b>, иначе после «засыпания» сервера придётся входить заново. Никому его не показывайте!";$("#oi").outerHTML='<textarea id="oi" readonly>'+esc(r.session)+'</textarea>';$("#ob").textContent="Скопировать ключ и закрыть"}};
(async()=>{const s=await api("/api/state");if(!s.ok)ask("Вход в Telegram","Нужно один раз. Введите номер аккаунта Telegram в международном формате. Лучше запасной аккаунт.","+79991234567","Получить код")})();
let res=[],es=null,tab="r",fav=ls("fav",{}),hid=ls("hid",[]),hist=ls("hist",[]);
$("#t").innerHTML=[..."DARKSCOUT"].map((c,i)=>`<i style="animation-delay:${i*80}ms">${c}</i>`).join("");
$("#mv").oninput=e=>$("#mvv").textContent=e.target.value;
document.onkeydown=e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}};
// фон: медленно дрейфующие частицы
const cv=$("#c"),cx=cv.getContext("2d");let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(70,innerWidth/18|0)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))}
addEventListener("resize",rs);rs();
(function d(){cx.clearRect(0,0,cv.width,cv.height);P.forEach((p,i)=>{p.x=(p.x+p.vx+cv.width)%cv.width;p.y=(p.y+p.vy+cv.height)%cv.height;cx.fillStyle="#8b5cff55";cx.fillRect(p.x,p.y,2,2);for(let j=i+1;j<P.length;j++){const q=P[j],l=Math.hypot(p.x-q.x,p.y-q.y);if(l<130){cx.strokeStyle=`rgba(139,92,255,${.1*(1-l/130)})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}});requestAnimationFrame(d)})();
function drawHist(){$("#h").innerHTML=hist.map(h=>`<button data-h="${esc(h)}">${esc(h)}</button>`).join("")}
$("#h").onclick=e=>{const h=e.target.dataset.h;if(h){$("#q").value=h;$("#f").requestSubmit()}};
const list=()=>{let a=tab==="f"?Object.values(fav):res.filter(r=>!hid.includes(r.username));
 const ms=+$("#ms").value,k=$("#so").value;a=a.filter(r=>r.subs>=ms&&(!$("#act").checked||r.age<=30));return a.sort((x,y)=>y[k]-x[k])};
function render(){const a=list();$("#g").innerHTML=a.length?a.map((r,i)=>`<div class="card" style="animation-delay:${Math.min(i,12)*60}ms" data-u="${esc(r.username)}">
<span class="tag ${r.age<=30?"fresh":""}">${r.age<=30?"активен":r.age<9999?r.age+" дн. назад":"—"}</span>
<h3>${esc(r.title)}</h3><a class="u" href="https://t.me/${esc(r.username)}" target="_blank" rel="noopener">@${esc(r.username)}</a>
<p>${esc(r.about)||"Без описания"}</p>
<div class="st"><span><b>${r.videos}</b>видео</span><span><b>${r.photos}</b>фото</span><span><b>${r.subs>=1e3?(r.subs/1e3).toFixed(1)+"K":r.subs}</b>подписчиков</span></div>
<div class="rb"><i data-w="${Math.round(r.ratio*100)}"></i></div><div style="font-size:12px;color:var(--mut);margin-top:5px">видео — ${Math.round(r.ratio*100)}% от всех постов</div>
<div class="act"><a class="o" href="tg://resolve?domain=${esc(r.username)}">Открыть в Telegram</a><button data-a="fav">${fav[r.username]?"★":"☆"}</button><button data-a="hide" title="Скрыть">✕</button></div></div>`).join(""):`<div class="empty">${tab==="f"?"В избранном пока пусто.":"Введите ключевое слово и нажмите «Искать»."}</div>`;
 requestAnimationFrame(()=>document.querySelectorAll(".rb i").forEach(e=>e.style.width=e.dataset.w+"%"))}
$("#g").onclick=e=>{const b=e.target.closest("button"),c=e.target.closest(".card");if(!b||!c)return;const u=c.dataset.u,r=res.find(x=>x.username===u)||fav[u];
 if(b.dataset.a==="fav"){fav[u]?delete fav[u]:fav[u]=r;localStorage.fav=JSON.stringify(fav);render()}
 if(b.dataset.a==="hide"){hid.push(u);localStorage.hid=JSON.stringify(hid);c.style.cssText="transition:.4s;opacity:0;transform:scale(.9)";setTimeout(render,380)}};
$("#g").onmousemove=e=>{const c=e.target.closest(".card");if(c){const b=c.getBoundingClientRect();c.style.setProperty("--x",e.clientX-b.left+"px");c.style.setProperty("--y",e.clientY-b.top+"px")}};
$("#tr").onclick=()=>{tab="r";$("#tr").classList.add("on");$("#tf").classList.remove("on");render()};
$("#tf").onclick=()=>{tab="f";$("#tf").classList.add("on");$("#tr").classList.remove("on");render()};
["ms","so","act"].forEach(i=>$("#"+i).onchange=render);
$("#ex").onclick=()=>{navigator.clipboard.writeText(list().map(r=>"https://t.me/"+r.username).join("\n"));$("#ex").textContent="Скопировано ✓";setTimeout(()=>$("#ex").textContent="Копировать ссылки",1500)};
$("#csv").onclick=()=>{const a=list(),csv="username,title,subs,videos,photos,ratio,link\n"+a.map(r=>[r.username,'"'+r.title.replace(/"/g,'""')+'"',r.subs,r.videos,r.photos,r.ratio,"https://t.me/"+r.username].join(",")).join("\n");
 const l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));l.download="channels.csv";l.click()};
$("#f").onsubmit=e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;es&&es.close();res=[];tab="r";$("#tr").onclick();document.body.classList.add("s");
 hist=[q,...hist.filter(h=>h!==q)].slice(0,8);localStorage.hist=JSON.stringify(hist);drawHist();$("#pg").classList.add("on");
 es=new EventSource(`/api/search?q=${encodeURIComponent(q)}&min_videos=${$("#mv").value}&web=${$("#web").checked}&deep=${$("#deep").checked}&k=${encodeURIComponent(K)}`);
 es.onmessage=m=>{const d=JSON.parse(m.data);if(d.p!=null)$("#pg b").style.width=d.p+"%";
  if(d.type==="status")$("#stt").textContent=d.text;
  if(d.type==="channel"){if(!res.some(r=>r.username===d.channel.username))res.push(d.channel);render()}
  if(d.type==="error"){$("#stt").textContent=d.text;es.close()}
  if(d.type==="done"){$("#stt").textContent=`Готово: найдено ${d.total}, проверено ${d.checked}`;es.close();setTimeout(()=>$("#pg").classList.remove("on"),800)}};
 es.onerror=()=>{es.close();$("#stt").textContent="Связь прервана. Проверьте, что сервер запущен."}};
drawHist();render();
</script>
</html>
